[project]
name = "ds-prompt-engineering"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "pydantic>=2.13.4",
    "langchain>=1.4.7",
    "langchain-mistralai>=1.1.6",
    "langchain-openrouter>=0.2.9",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
